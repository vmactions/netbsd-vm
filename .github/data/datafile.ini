

VM_NAME=NetBSD

VM_OS_NAME=netbsd

VM_RUNS_ON=ubuntu-latest

#The guest's default PKG_PATH (amd64/<release>/All) 302-redirects to the
#current quarterly, and for the whole 9.x branch that is x86_64/9.0_2026Q2,
#whose bulk build shipped ZERO packages -- so this step died with "no pkg
#found for 'curl'" on every 9.x amd64 job. 10.x/11.0 are unaffected (their Q2
#sets hold ~27.5k packages each), and so is aarch64 9.x, so for them the first
#command succeeds and the fallback never runs. The previous quarterly,
#x86_64/9.0_2026Q1, is intact (27823 packages incl. curl-8.20.0) and is served
#with no redirect, which the old 9.x pkg_add needs. Same archive path
#netbsd-builder's 9.x confs already fall back to in VM_INSTALL_CMD (they hit
#this at the Q2 rollover on 2026-07-21, when Q2 was merely missing fuse-sshfs).
#Drop the fallback once a quarterly ships a real 9.x bulk build again.
VM_PREPARE="/usr/sbin/pkg_add -u curl || PKG_PATH=http://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/x86_64/9.0_2026Q1/All /usr/sbin/pkg_add -u curl"

VM_RUN=@.github/data/run.txt

VM_SET_RELEASE=9.3

VM_SHELL_COMMENTS=""


TEST_RELEASES=@conf/test.releases

RELEASE_TABLE=@https://raw.githubusercontent.com/anyvm-org/netbsd-builder/refs/heads/main/.github/data/table.md

VM_TEST_EXCLUDE=@.github/data/exclude.txt


VM_SYNC_METHODS_MAP=@.github/data/sync-map.json

VM_TEST_EXCLUDE_MISSING=@.github/data/exclude-missing.txt
