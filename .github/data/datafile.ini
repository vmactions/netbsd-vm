

VM_NAME=NetBSD

VM_OS_NAME=netbsd

VM_RUNS_ON=ubuntu-latest

#No PKG_PATH here: it comes from /etc/pkg_install.conf, baked into every
#image by netbsd-builder's hooks/vm_postBuild.sh (newest quarterly that
#actually exists in the arch listing first, rolling alias as self-healing
#backup, arch-gated 9.0_2026Q1 pin for the 9.x era). The builder runs its
#own package installs through that same baked file, so a bad bake fails
#the build there instead of surfacing here. History: a hardcoded x86_64
#fallback here installed an x86_64 curl on a riscv64 guest (run
#30790664175); an arch-scoped case fallback replaced it briefly, then
#became redundant once the bake was fixed. Needs v2.2.1+ builder images
#-- older riscv64 images carry a dead baked alias.
VM_PREPARE="/usr/sbin/pkg_add -u curl"

VM_RUN=@.github/data/run.txt

VM_SET_RELEASE=10.1

VM_SHELL_COMMENTS=""


TEST_RELEASES=@conf/test.releases

RELEASE_TABLE=@https://raw.githubusercontent.com/anyvm-org/netbsd-builder/refs/heads/main/.github/data/table.md

VM_TEST_EXCLUDE=@.github/data/exclude.txt


VM_SYNC_METHODS_MAP=@.github/data/sync-map.json

VM_TEST_EXCLUDE_MISSING=@.github/data/exclude-missing.txt
